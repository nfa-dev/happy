name: Deploy web to Pages

# happy-app 을 Expo web 으로 export 해서 GitHub Pages 에 올린다.
# 결과: https://nfa-dev.github.io/happy/
#
# 이 브랜치(pages)는 upstream main 위에 웹 키보드 스크롤 수정, 모델 피커 한 건, 이 워크플로만 얹은 것이다.
# 자세한 내용은 .github/pages/README.md.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '번들에 베이크할 happy-server URL (비우면 upstream 기본값 api.cluster-fluster.com)'
        required: false
        default: ''
  push:
    branches: [ pages ]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 빌드는 최신 것으로 대체한다.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 프로젝트 페이지는 /<repo> 아래서 서빙되므로 자산 경로에 이 prefix 가 베이크돼야 한다.
  BASE_PATH: /happy
  # app.config.js 의 variant. 없으면 development 로 잡혀 탭 제목이 "Happy (dev)" 가 되고
  # 콘솔 로깅이 기본 on 이다. 웹 export 에서 갈리는 건 이 둘뿐(나머지는 네이티브 전용).
  APP_ENV: production
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # packageManager: pnpm@10.11.0 을 corepack 이 그대로 집는다.
      - name: Enable corepack
        run: |
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # happy-app 서브그래프만 설치. 필터는 패키지명이 아니라 디렉토리 경로 기준 —
      # upstream 이 패키지명을 바꿔도 조용히 빈 설치가 되지 않도록 (pnpm 은 no-match 여도 exit 0).
      - name: Install (happy-app subgraph)
        run: |
          set -eux
          SKIP_HAPPY_WIRE_BUILD=1 pnpm install --frozen-lockfile \
            --filter "{packages/happy-app}..." \
            --config.node-linker=isolated \
            --config.shamefully-hoist=false
          test -d node_modules
          pnpm --filter "{packages/happy-wire}" build

      # 뒤집힌 축의 측정은 upstream 의 루트 postinstall 이 고친다
      # (scripts/postinstall.cjs → patches/fix-flash-list-web-inversion.cjs). 서브그래프 필터
      # 설치에서도 루트 훅은 돌지만, 조용히 빠진 채 배포되면 위로 올릴 때 빈 화면이 되므로
      # 확인만 하고 넘어간다. 여기서 두 번째 수정을 얹으면 upstream 것이 죽은 코드가 된다.
      - name: Verify upstream's flash-list web measurement fix
        run: |
          set -eux
          FL_MEASURE="$(readlink -f packages/happy-app/node_modules/@shopify/flash-list)/dist/recyclerview/utils/measureLayout.web.js"
          test -f "${FL_MEASURE}"
          grep -q 'DOMMatrixReadOnly' "${FL_MEASURE}"
      # Metro 는 타입을 확인하지 않고 지워버리기만 한다. 이 브랜치는 소스에 수정을 얹고
      # upstream 위로 rebase 하며 사는 형상이라, 타입이 어긋난 채 배포되지 않게 여기서 막는다.
      # (upstream 의 typecheck 워크플로는 main 대상 PR 에서만 돈다)
      #
      # 범위는 실제로 번들되는 소스로 좁힌다. 여기서는 happy-app 서브그래프만 설치하므로
      # 다른 워크스페이스가 끌고 오는 @types/* 가 없고, spec 파일이 그걸 참조해 실패한다
      # (예: diff/syntax/factory.spec.ts → @types/babel__core). upstream 워크플로는 전체
      # 설치라 안 겪는 문제다. 테스트 파일은 바로 다음 스텝에서 vitest 로 실제 실행한다.
      - name: Typecheck (happy-app sources)
        run: |
          set -eux
          cat > packages/happy-app/tsconfig.pages.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "exclude": [
              "sources/trash/**/*",
              "node_modules",
              "**/*.spec.ts",
              "**/*.spec.tsx",
              "**/*.test.ts",
              "**/*.test.tsx"
            ]
          }
          JSON
          pnpm --filter "{packages/happy-app}" exec tsc --noEmit -p tsconfig.pages.json
          rm packages/happy-app/tsconfig.pages.json

      - name: Unit tests (chat list keyboard scroll)
        run: |
          pnpm --filter "{packages/happy-app}" exec vitest run \
            sources/components/chatListKeyboardScroll.test.ts

      # Expo 는 experiments.baseUrl 을 빌드 타임에 베이크한다. 여기서 주입하면 브랜치 diff 가
      # 커밋 하나로 유지돼 upstream rebase 가 쉽다. 이미 있으면 사람이 봐야 하므로 fail-fast.
      - name: Inject experiments.baseUrl
        run: |
          set -eux
          if grep -q "baseUrl" packages/happy-app/app.config.js; then
            echo "app.config.js 에 이미 baseUrl 이 있다 — upstream 이 손댄 것이므로 확인 필요"
            exit 1
          fi
          sed -i -E "s|experiments:[[:space:]]*\{|experiments: { baseUrl: \"${BASE_PATH}\",|" \
            packages/happy-app/app.config.js
          grep -n "baseUrl" packages/happy-app/app.config.js

      - name: Expo export (web)
        env:
          SERVER_URL: ${{ inputs.server_url }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -eux
          # 비우면 앱이 upstream 기본값(api.cluster-fluster.com)으로 떨어지고, 사용자는
          # 앱 안 /server 화면에서 각자 override 할 수 있다 (MMKV 에 저장, 로그아웃해도 유지).
          if [ -n "${SERVER_URL}" ]; then
            export EXPO_PUBLIC_HAPPY_SERVER_URL="${SERVER_URL}"
          fi
          pnpm --filter "{packages/happy-app}" exec expo export --platform web --output-dir dist
          test -f packages/happy-app/dist/index.html

      - name: Pages post-processing
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          set -eux
          DIST=packages/happy-app/dist
          # Pages 에는 SPA rewrite 가 없다. 404.html 로 같은 번들을 세워야 딥링크
          # (/happy/session/<id>) 가 산다 — 상태코드는 404 로 남지만 라우터가 URL 을 읽는다.
          cp "${DIST}/index.html" "${DIST}/404.html"
          # Actions 아티팩트로 배포하면 Jekyll 이 돌지 않지만, 나중에 브랜치 배포로 바꿔도
          # _expo/ 가 살아남도록 같이 둔다 (Jekyll 은 밑줄로 시작하는 경로를 버린다).
          touch "${DIST}/.nojekyll"
          # 어떤 형상이 떠 있는지 밖에서 보이게 — GET /happy/build-info.json
          node -e '
            const fs = require("fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              sha: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF_NAME,
              runId: process.env.GITHUB_RUN_ID,
              builtAt: new Date().toISOString(),
              basePath: process.env.BASE_PATH,
              serverUrl: process.env.SERVER_URL || "(기본값: api.cluster-fluster.com)",
              localPatches: ["slopus/happy#1518 (commit, ported)"],
            }, null, 2) + "\n");
          ' "${DIST}/build-info.json"
          cat "${DIST}/build-info.json"
          du -sh "${DIST}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/happy-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
